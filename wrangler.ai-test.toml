# GENUINE-INFERENCE TEST configuration (local Worker + local D1 + REAL Workers AI).
# Use only for the manual procedure in docs/assistant.md, after `wrangler login`.
# Workers AI calls always run on Cloudflare and count against the account's free
# daily allocation (10,000 Neurons). It reuses the same LOCAL D1 as `npm run dev:api`
# (seed it with synthetic data only: `npm run db:seed:synthetic`). Run: `npm run dev:api:ai`.
name = "trackwell"
main = "worker/src/index.ts"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"

[[d1_databases]]
binding = "DB"
database_name = "trackwell"
database_id = "00000000-0000-4000-8000-000000000000" # local-only placeholder
migrations_dir = "migrations"

[ai]
binding = "AI"

[vars]
ALLOWED_ORIGIN = "http://127.0.0.1:5173"
AI_MODE = "workers-ai"
AI_MODEL = "@cf/zai-org/glm-4.7-flash"
AI_DAILY_LIMIT = "20"
